name: CI - Fatigue Detector

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          activate-environment: fatigue-detector
          python-version: 3.10

      - name: Create environment from file
        shell: bash -l {0}
        run: conda env create -f environment.yml

      - name: Test GUI import
        shell: bash -l {0}
        run: |
          conda activate fatigue-detector
          python -c "import start_gui"
