name: CI - Fatigue Detector

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: fatigue-detector
          python-version: 3.10

      - name: Test import of main GUI script
        shell: bash -l {0}
        run: |
          python -c "import start_gui"
