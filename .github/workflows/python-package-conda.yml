name: BNBL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        auto-activate-base: false
        python-version: 3.10
        environment-file: environment.yml
        activate-environment: bnbl-fatigue-detector

    - name: Verify environment and versions
      run: |
        conda info --envs
        python --version
        pip list

    - name: Run a basic script to check launch
      run: |
        python start_gui.py || echo "GUI cannot launch in headless CI — test only dependencies"
