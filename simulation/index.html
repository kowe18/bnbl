<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>bnbl - Fatigue Detection </title>
    <style>
      body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
      #c {
         width: 100%;
         height: 100%;
         display: block;
         background: url(resources/images/daikanyama.jpg) no-repeat center center;
         background-size: cover;
        }
      
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loading-content {
        text-align: center;
        color: white;
      }
      
      .loading-content h1 {
        margin: 0 0 20px 0;
        font-size: 2.5em;
      }
      
      .progress-bar {
        width: 300px;
        height: 8px;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        overflow: hidden;
        margin: 20px 0;
      }
      
      .progress-fill {
        height: 100%;
        background: white;
        width: 0%;
        transition: width 0.3s;
        border-radius: 10px;
      }

      .perf-panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 9999;
        background: rgba(0,0,0,0.65);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 1.35;
        min-width: 180px;
      }
      
      .loading-text {
        font-size: 1.2em;
        margin-top: 10px;
      }
      
      #info-panel {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0,0,0,0.7);
        color: white;
        padding: 15px;
        border-radius: 8px;
        font-size: 14px;
        max-width: 300px;
        display: none;
      }
      
      #info-panel.visible {
        display: block;
      }

      
      #connection-status {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: bold;
      }
      
      .status-connected {
        background: #10b981;
        color: white;
      }
      
      .status-disconnected {
        background: #ef4444;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-content">
        <h1>BNBL Fatigue Detection</h1>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loading-text" id="loading-text">Loading 3D models...</div>
      </div>
    </div>
    
    <div id="connection-status" class="status-disconnected">WebSocket: Disconnected</div>
    
    <div id="info-panel">
      <h3 style="margin-top:0;">Object Info</h3>
      <div id="info-content"></div>
    </div>

    <div id="perf-panel" class="perf-panel">
      <div><strong>Performance</strong></div>
      <div id="perf-loading">Loading: -</div>
      <div id="perf-firstframe">First frame: -</div>
      <div id="perf-fps">FPS(avg): -</div>
      <div id="perf-ws">WS msgs/s: -</div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
